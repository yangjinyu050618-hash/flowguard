name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"  # Runs automatically every day at 00:00 UTC (08:00 Beijing Time)
  workflow_dispatch:      # Allows manual trigger with one click anytime

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy hatchling
          pip install -e .

      - name: Run Ruff Lint and Format Check
        run: |
          ruff check src tests examples benchmarks
          ruff format --check src tests examples benchmarks

      - name: Check Disallowed Control Characters
        run: |
          python -c "
          import os, sys
          bad_files = {}
          for root, dirs, files in os.walk('.'):
              if any(ignored in root for ignored in ('.git', '.pytest_cache', '__pycache__', '.mypy_cache', '.venv', 'venv')):
                  continue
              for file in files:
                  if file.endswith(('.py', '.md', '.yml', '.yaml', '.toml', '.txt', '.json')):
                      path = os.path.join(root, file)
                      with open(path, 'rb') as f:
                          content = f.read()
                      for i, b in enumerate(content):
                          if b < 32 and b not in (9, 10, 13):
                              bad_files.setdefault(path, []).append((i, hex(b)))
          if bad_files:
              print('Disallowed control characters found:', bad_files, file=sys.stderr)
              sys.exit(1)
          print('Control character check passed: 0 disallowed bytes found.')
          "

      - name: Run Mypy Strict Type Check
        run: |
          mypy src/flowguard

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [lint-and-typecheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling pytest pytest-asyncio pytest-cov
          pip install -e .

      - name: Run Tests with Coverage
        run: |
          pytest --cov=flowguard --cov-fail-under=80 -v

  sdk-contracts:
    name: Official SDK Contracts Verification
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Dependencies with Official SDKs
        run: |
          python -m pip install --upgrade pip
          pip install hatchling pytest pytest-asyncio pytest-cov
          pip install openai anthropic google-genai httpx
          pip install -e .

      - name: Run Official SDK Contract Tests
        run: |
          pytest tests/test_official_sdk_contracts.py -v

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [lint-and-typecheck, test, sdk-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTRACTS_RESULT: ${{ needs.sdk-contracts.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
