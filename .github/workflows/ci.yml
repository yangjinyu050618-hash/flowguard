name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"  # Runs automatically every day at 00:00 UTC (08:00 Beijing Time)
  workflow_dispatch:      # Allows manual trigger with one click anytime

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy hatchling
          pip install -e .

      - name: Run Ruff Lint
        run: |
          ruff check src tests

      - name: Run Mypy Strict Type Check
        run: |
          mypy src/flowguard

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [lint-and-typecheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling pytest pytest-asyncio pytest-cov
          pip install -e .

      - name: Run Tests with Coverage
        run: |
          pytest --cov=flowguard --cov-fail-under=80 -v
