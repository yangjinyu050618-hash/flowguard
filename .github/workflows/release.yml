name: Release and Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test-before-release:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install hatchling pytest pytest-asyncio
          pip install -e .
          pytest

  build-and-publish:
    name: Build wheels and publish to PyPI
    needs: [test-before-release]
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build hatchling

      - name: Build package distributions
        run: |
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128480b75e92d6 # v1.12.4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd53287ba072042f618d687406c630db0 # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
