[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowguard-core"
version = "0.3.0"
description = "High-performance Async Rate Limiting, Circuit Breaking & Resilience Orchestration for LLM & API Pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "yangjinyu050618-hash", email = "yangjinyu050618@gmail.com" }
]
keywords = [
    "rate-limiter",
    "circuit-breaker",
    "resilience",
    "fallback",
    "asyncio",
    "llm",
    "openai",
    "anthropic",
    "gemini",
    "token-bucket",
    "exponential-backoff",
    "bulkhead",
    "retry"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
all = [
    "httpx>=0.24.0",
]
contracts = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
flowguard = "flowguard.cli:main"

[project.urls]
Homepage = "https://github.com/yangjinyu050618-hash/flowguard"
Documentation = "https://github.com/yangjinyu050618-hash/flowguard#readme"
Repository = "https://github.com/yangjinyu050618-hash/flowguard.git"
Issues = "https://github.com/yangjinyu050618-hash/flowguard/issues"
Changelog = "https://github.com/yangjinyu050618-hash/flowguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/flowguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
